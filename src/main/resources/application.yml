spring:
  application:
    name: claude1

  datasource:
    url: jdbc:postgresql://localhost:5432/clientes_db_001
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false


api:
  security:
    token:
      secret: ${JWT_SECRET:my-secret-key}